<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <p>Fill in this form to register</p>
    <form action="submit">
    <label>First Name </label>
    <input type="text" placeholder="Enter your first name" required><br><br>
    Last Name<input type="text" placeholder="Enter your last name"  required><br><br>
    <label>E-mail </label> 
    <input type="email" placeholder="Enter your e-mail"  required><br><br>
    <label>Date of Birth</label> 
    <input type="date" ><br><br>
    Age:<input type="number" min="18" max="100"><br><br>
    Set Username<input type="text" placeholder="Set Username"  required><br><br>
    Set Password<input type="password" placeholder="Set Password"  required><br><br>
    Gender<br><input type="radio" name="gender">Male
    <br><input type="radio" name="gender">Female
    <br><input type="radio" name="gender">Others
    <br><br>
    <label for="course">Course:</label>
    <select name="course" style="width:150px" default>
        <option value="course" selected disabled>Course</option>
        <option>Java</option>
        <option>Python</option>
        <option>Spring</option>
        <option>DBMS</option>
    </select><br><br>
    <input type="submit" value ="submit"></input>
    </form>
</body>
</html>
