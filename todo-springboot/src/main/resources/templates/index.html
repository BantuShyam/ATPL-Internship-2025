<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Todo Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; }
        .nav {
            margin-bottom: 20px;
            text-align: center;
        }
        .nav a {
            margin: 0 10px;
            padding: 8px 15px;
            background: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .nav a:hover {
            background: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table, th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background: #f4f4f4;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1 th:text="${viewType != null ? viewType : 'All Tasks'}"></h1>

    <!-- Navigation -->
    <div class="nav">
        <a th:href="@{/todos}">All</a>
        <a th:href="@{/todos/weekly}">Weekly</a>
        <a th:href="@{/todos/monthly}">Monthly</a>
        <a th:href="@{/todos/add}">Add New Task</a>
    </div>

    <!-- Tasks Table -->
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Created At</th>
                <th>Updated At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="todo : ${todos}">
                <td th:text="${todo.title}"></td>
                <td th:text="${todo.status}"></td>
                <td th:text="${todo.priority}"></td>
                <td th:text="${#temporals.format(todo.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${#temporals.format(todo.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td>
                    <a th:href="@{'/todos/updateStatus/' + ${todo.id} + '?status=IN_PROGRESS'}">Mark In Progress</a> |
                    <a th:href="@{'/todos/updateStatus/' + ${todo.id} + '?status=DONE'}">Mark Done</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
